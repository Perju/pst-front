@if (isVisible) {
    <div class="clip-container">
        <div class="click-blocker"></div>
        @if (safeEmbedUrl) {
            <iframe
              [src]="safeEmbedUrl"
              height="720"
              width="1280"
              allowfullscreen="true"
              scrolling="no"
              frameborder="0">
            </iframe>
        }
    </div>
}
